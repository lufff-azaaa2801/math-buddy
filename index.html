<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Matematika Persamaan Linear Satu Variabel</title>
    
   
    <style>
      
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #3c3c3c;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

      
        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 20px;
        }

       
        h1, h2 {
            color: #ef76a4; 
            font-weight: 700;
        }

       
        .screen {
            display: block;
        }
        .hidden {
            display: none !important;
        }

    
        .progress-bar-container {
            width: 100%;
            height: 16px;
            background-color: #e5e5e5;
            border-radius: 20px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%; /* Nanti digerakkan oleh JavaScript */
            background-color: #ef6fa4;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        
        .quiz-box {
            background: #ffffff;
            border: 2px solid #e5e5e5;
            border-bottom: 6px solid #e5e5e5; /* Efek 3D Duolingo */
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        
        .btn-primary {
            background-color: #ba5273;
            color: white;
            border: none;
            border-bottom: 4px solid #ba5273; /* Efek 3D */
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: filter 0.1s;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .btn-primary:active {
            border-bottom: 0px;
            margin-top: 4px;
        }

       
        .btn-option {
            background-color: #ffffff;
            color: #3c3c3c;
            border: 2px solid #e5e5e5;
            border-bottom: 4px solid #e5e5e5;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-option:hover {
            background-color: #f7f7f7;
        }
        .btn-option:active {
            border-bottom: 2px solid #e5e5e5;
        }

        /* Tombol Abu-abu (Batal / Ulang) */
        .btn-secondary {
            background-color: #ffffff;
            color: #afafaf;
            border: 2px solid #e5e5e5;
            border-bottom: 4px solid #e5e5e5;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
        }

       
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #84d8ff;
        }

      
        .final-score {
            font-size: 64px;
            font-weight: bold;
            color: #ef7bad; 
            margin: 20px 0;
        }

     
        ol {
            text-align: left;
            background: #f7f7f7;
            padding: 20px 40px;
            border-radius: 16px;
            border: 2px solid #e5e5e5;
        }
        li {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4b4b4b;
        }
    </style> 
</head>
<body>

    <div class="container">
        
      
        <div id="menu-screen" class="screen">
            <h1>🧠 Math Buddy!</h1>
            <p>Lo bisa matematika? Asah skill lo dengan game ini!</p>
            <br>
            <button id="start-btn" class="btn-primary">Mulai Kuis</button>
        </div>

      
        <div id="quiz-screen" class="screen hidden">
            <!-- Indikator Progress -->
            <div class="progress-bar-container">
                <div id="progress" class="progress-bar"></div>
            </div>

            <div class="quiz-box">
                <h2 id="question">Pertanyaan</h2>
                <div id="options-container" class="options-grid">
                   
                </div>
            </div>
        </div>


        <div id="score-screen" class="screen hidden">
            <h2>🎉 Selesai deh!</h2>
            <p>Skor Kamu:</p>
            <div class="final-score" id="final-score">0</div>

            <div>
                <input type="text" id="username" placeholder="Ketik nama kamu..." maxlength="15">
                <button id="save-score-btn" class="btn-primary">Simpan Skor</button>
            </div>
        </div>

        <div id="leaderboard-screen" class="screen hidden">
            <h2>🏆 Papan Skor Tertinggi</h2>
            <ol id="leaderboard-list">

            </ol>
            <button id="restart-btn" class="btn-secondary">Main Lagi</button>
        </div>

    </div> 

    <script src="script.js"></script>
</body>
</html>
